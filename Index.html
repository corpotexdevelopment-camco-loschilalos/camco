<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',system-ui,sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none;--ink:#172033;--muted:#8a92a2;--line:#e9ecf3;--blue:#4265ed;--green:#20a779;--red:#e25b58;--orange:#efa342}*{box-sizing:border-box}body{margin:0;background:#f6f7fb}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.app{max-width:480px;min-height:100dvh;margin:auto;background:#f9fafd;box-shadow:0 0 60px #1720330d;position:relative;padding-bottom:105px}.top{padding:21px 22px 8px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font:800 20px Manrope}.mark{width:32px;height:32px;border-radius:11px;background:#233a92;color:white;display:grid;place-items:center;font:800 19px Manrope}.topright{display:flex;align-items:center;gap:8px}.live{display:flex;align-items:center;gap:6px;color:#198d65;background:#e9f9f2;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:800}.live i{width:7px;height:7px;background:currentColor;border-radius:50%;box-shadow:0 0 0 3px #23ae7a26}.live.local{color:#857655;background:#fbf4e5}.profile{border:1px solid #e9ebf4;background:white;width:35px;height:35px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#4661bb}.container{padding:12px 20px}.hero{display:flex;justify-content:space-between;align-items:start;margin:4px 0 20px}.eyebrow{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:1.35px;color:#8a93a4;margin:0 0 6px}.hero h1{font:800 27px/1.17 Manrope;margin:0;letter-spacing:-1.2px}.hero p{font-size:13px;color:#8790a0;margin:7px 0 0}.pillcount{padding:8px 12px;background:#ebefff;color:#4462dc;font-size:12px;border-radius:999px;font-weight:800;white-space:nowrap}.subhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.subhead h2{font:800 16px Manrope;margin:0;letter-spacing:-.3px}.subhead small{font-size:12px;color:#8992a2}.filters{display:flex;gap:7px;overflow-x:auto;padding:0 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{background:#fff;border:1px solid #e9ebf3;padding:10px 14px;border-radius:14px;font-weight:800;font-size:12px;color:#9098a7;white-space:nowrap}.chip.selected{background:#293b78;color:#fff;border-color:#293b78}.cards{display:grid;gap:12px;margin-top:13px}.job{background:white;border:1px solid #eaeef5;border-radius:19px;padding:15px;box-shadow:0 7px 25px #1d2c5210}.jobtop{display:flex;gap:11px;align-items:center}.thumb{width:53px;height:57px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden}.shirt{width:34px;height:35px;filter:drop-shadow(0 4px 4px #0002)}.jobmain{flex:1;min-width:0}.name{font:800 14px Manrope;letter-spacing:-.25px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.meta{font-size:11px;color:#9098a6;font-weight:600;margin-top:5px}.jobid{color:#8c94a3;font-size:10px;font-weight:800}.state{font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;white-space:nowrap}.pending{background:#edf1ff;color:#5268ce}.active{background:#e7f8ed;color:#1f9b69}.paused{background:#fff3e2;color:#c18323}.done{background:#eaf9f2;color:#179765}.jobstats{display:flex;gap:7px;align-items:center;margin-top:13px;justify-content:space-between}.tag{font-size:10px;color:#717f94;font-weight:800;padding:5px 7px;background:#f4f6fa;border-radius:7px}.tag.urgent{background:#fff0ed;color:#e26a4a}.track{height:5px;background:#edf0f6;border-radius:15px;margin:12px 0 14px;overflow:hidden}.track>i{display:block;height:100%;background:#7088ee;border-radius:15px;transition:width .25s}.actions{display:flex;gap:8px}.action{flex:1;border-radius:11px;padding:11px 10px;min-height:40px;font-size:12px;font-weight:800;border:1px solid #e6e9f2;background:white;color:#536079}.action.primary{background:#4365e9;color:white;border-color:#4365e9}.action.success{background:#1fa47a;color:#fff;border-color:#1fa47a}.action.warn{background:#fff5e7;color:#ab7220;border-color:#fff0d6}.empty{border:1px dashed #dbe2f0;border-radius:18px;padding:28px 18px;text-align:center;background:white;color:#8993a6;font-size:13px}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:78px;padding:9px 18px max(9px,env(safe-area-inset-bottom));display:flex;background:#fff;border-top:1px solid #edf0f6;justify-content:space-around;z-index:30}.nav{border:0;background:transparent;color:#919bac;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:10px;font-weight:800;min-width:65px}.nav.on{color:#4764e3}.nav svg{width:22px;height:22px}.login{min-height:80dvh;padding:48px 23px 40px;display:flex;flex-direction:column;justify-content:center}.login .bigmark{height:57px;width:57px;border-radius:19px;background:#29408b;color:white;font:800 30px Manrope;display:grid;place-items:center;margin-bottom:23px;box-shadow:0 12px 25px #29408b33}.login h1{font:800 31px/1.1 Manrope;letter-spacing:-1.4px;margin:0}.login>p{color:#8893a5;font-size:14px;line-height:1.65;margin:12px 0 28px}.fieldlabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#8993a3;display:block;margin:0 0 9px}.input{width:100%;background:#fff;border:1px solid #e1e6ef;border-radius:13px;padding:14px 13px;color:#293347;outline:0}.input:focus{border-color:#6b86eb;box-shadow:0 0 0 3px #4265ed18}.field{margin-bottom:19px}.go{background:#4265ed;border:none;border-radius:14px;padding:16px;color:white;font-weight:800;width:100%;margin-top:8px;box-shadow:0 12px 25px #4265ed2b}.soft{background:#f1f3fb;padding:12px 14px;border-radius:13px;color:#7b869a;font-size:12px;line-height:1.6;margin-top:20px}.overview{display:flex;gap:10px}.metric{flex:1;background:white;border:1px solid #e8ebf2;border-radius:16px;padding:13px 12px}.metric strong{font:800 20px Manrope}.metric div{color:#8e97a6;font-size:11px;margin-top:4px}.prod{background:white;border:1px solid #ebedf3;border-radius:18px;padding:14px;margin:11px 0;display:flex;align-items:center;gap:12px;text-align:left;width:100%}.prod .thumb{width:54px;height:56px}.prod b{font:800 13px Manrope;display:block}.prod span{font-size:11px;color:#8e98a8}.prod .chevron{margin-left:auto;color:#acb4c3;font-size:23px}.back{display:inline-flex;gap:8px;align-items:center;background:none;border:0;color:#7c879b;font-size:12px;font-weight:800;padding:0;margin-bottom:24px}.timeline{background:#fff;border:1px solid #ebedf3;border-radius:20px;padding:17px 17px 6px;margin-top:18px}.step{display:flex;gap:13px;min-height:71px}.rail{display:flex;align-items:center;flex-direction:column;width:28px}.dot{height:27px;width:27px;border-radius:50%;display:grid;place-items:center;background:#f0f2f7;border:1px solid #e5e9f1;color:#9ca5b4;font-size:12px;font-weight:800}.dot.complete{background:#25aa7e;color:white;border-color:#25aa7e}.dot.current{background:#506ce7;color:white;border-color:#506ce7;box-shadow:0 0 0 4px #516eed1a}.stem{width:2px;flex:1;background:#ebedf2;margin:4px 0}.stem.complete{background:#21b17b}.stepcontent{padding:2px 0 20px;flex:1;display:flex;justify-content:space-between;align-items:start}.stepcontent b{font:800 13px Manrope}.stepcontent p{font-size:11px;color:#929bab;margin:5px 0 0}.mini{font-weight:800;font-size:10px;color:#8e97a5;padding-top:3px}.mini.current{color:#4e6be5}.mini.complete{color:#1ca37b}.detailhead{display:flex;align-items:center;gap:16px}.detailhead .thumb{height:80px;width:81px;border-radius:20px}.detailhead .shirt{height:52px;width:52px}.detailhead h1{margin:0;font:800 20px Manrope}.detailhead p{margin:6px 0 0;color:#8b94a5;font-size:12px}.message{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(430px,calc(100vw - 30px));background:#263352;color:white;z-index:100;border-radius:13px;padding:13px 16px;font-size:12px;box-shadow:0 10px 30px #0003;display:none}.message.show{display:block}.smallhelp{font-size:12px;color:#8c96a7;line-height:1.6;margin:12px 0}.config{background:#fff;border-radius:16px;border:1px solid #e7eaf2;padding:15px;margin-top:15px}.config h3{font-size:13px;margin:0 0 9px}.config p{font-size:12px;color:#8490a1;line-height:1.7;margin:0 0 10px}.tinybtn{background:#eef1fe;border:0;border-radius:10px;color:#4563d1;font-size:11px;font-weight:800;padding:10px 12px}.row{display:flex;justify-content:space-between;align-items:center}.switch{padding:7px 10px;background:white;border:1px solid #e5e9f2;border-radius:9px;color:#6b7890;font-size:11px;font-weight:800}.bg{border:0;background:transparent;color:#4265ed;font-weight:800;font-size:11px}.modal{position:fixed;inset:0;background:#101b36a6;z-index:40;display:flex;align-items:end;justify-content:center}.sheet{background:white;padding:25px 22px max(28px,env(safe-area-inset-bottom));width:min(480px,100%);border-radius:25px 25px 0 0}.sheet h2{font:800 20px Manrope;margin:0 0 7px}.sheet p{color:#8892a2;font-size:13px;line-height:1.6}.sheet .actions{margin-top:20px}.time{font-size:11px;color:#929cad;font-weight:700}.warnline{font-size:11px;color:#cb7823;background:#fff6e8;border-radius:10px;padding:10px 12px;margin-top:12px}.hidden{display:none!important}@media(min-width:760px){.app{margin:28px auto;min-height:calc(100dvh - 56px);border-radius:25px;overflow:hidden}.tabbar{bottom:0}.login{min-height:70dvh}}@media(max-width:355px){.container{padding:10px 14px}.top{padding:18px 16px 8px}.action{font-size:11px;padding:10px 6px}.job{padding:12px}.chip{padding:9px 11px}}
</style>

<body><div class="app" id="app"></div><div id="toast" class="message" role="status"></div><div id="modalRoot"></div>
<script type="module">
/* Firebase optional: fill config below, enable Cloud Firestore, create collection "orders". Demo remains usable without it. */
const FIREBASE_CONFIG = null;
const STAGES=['Diseño','Corte','Costura','Estampado','Control de calidad','Empaque'];
const ROSTER={'Diseño':['Andrea','Mariana','Luis'],'Corte':['Carlos','Miguel','Rosa'],'Costura':['Elena','Patricia','Jorge'],'Estampado':['David','Pablo','Valeria'],'Control de calidad':['Lucía','Sofía','Alonso'],'Empaque':['José','Mónica','Gabriel']};
const SAMPLES=[
{id:'POL-1042',name:'Polo Essential blanco',client:'Nova Studio',qty:80,shade:'#f7f8fa',bg:'#e9e9f4',priority:'normal',stage:0,status:'pending',history:[]},
{id:'POL-1043',name:'Polo Urban negro',client:'Grupo Delta',qty:120,shade:'#292a36',bg:'#e9eafb',priority:'urgent',stage:1,status:'pending',history:[{stage:0,kind:'complete',worker:'Andrea',at:new Date(Date.now()-42e5).toISOString()}]},
{id:'POL-1044',name:'Polo Classic verde',client:'Milano Wear',qty:45,shade:'#527864',bg:'#e5f2eb',priority:'normal',stage:2,status:'paused',worker:'Elena',history:[{stage:0,kind:'complete',worker:'Andrea',at:new Date(Date.now()-75e5).toISOString()},{stage:1,kind:'complete',worker:'Carlos',at:new Date(Date.now()-55e5).toISOString()},{stage:2,kind:'start',worker:'Elena',at:new Date(Date.now()-24e5).toISOString()},{stage:2,kind:'pause',worker:'Elena',at:new Date(Date.now()-15e5).toISOString()}]},
{id:'POL-1045',name:'Polo Sport coral',client:'Equipo Norte',qty:60,shade:'#ed857a',bg:'#fff0eb',priority:'normal',stage:0,status:'pending',history:[]}
];
const KEY='hilo_taller_orders_v2', PERSON='hilo_taller_profile_v2';
let orders=[],profile=null,route='tasks',filter='all',focused=null,db=null,remote=false,unsubscribe=null,networkError=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{orders=JSON.parse(localStorage.getItem(KEY))||clone(SAMPLES)}catch{orders=clone(SAMPLES)}try{profile=JSON.parse(localStorage.getItem(PERSON))||null}catch{profile=null}if(!Array.isArray(orders))orders=clone(SAMPLES)}
function persist(){localStorage.setItem(KEY,JSON.stringify(orders))}
function icon(type){const paths={tasks:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',track:'<path d="M4 20V7m0 0 5 5M4 7l5-5M20 4v13m0 0-5-5m5 5-5 5M9 6h6M9 18h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-7 15-7 16 0"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+paths[type]+'</svg>'}
function garment(c){return `<svg class="shirt" viewBox="0 0 80 83" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g${c.replace('#','')}" x1="0" x2="1"><stop stop-color="${c}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><path d="M26 9c4 6 24 6 28 0l15 8 10 23-15 9-8-12v35H24V37l-8 12-15-9 10-23Z" fill="url(#g${c.replace('#','')})" stroke="#263048" stroke-opacity=".15" stroke-width="1.5"/><path d="M26 9Q40 24 54 9" fill="none" stroke="#333" stroke-opacity=".2" stroke-width="2.3"/><path d="M24 68H56M4 39l12 7m48 0 12-7" fill="none" stroke="#333" stroke-opacity=".13" stroke-width="1.5"/></svg>`}
function thumb(o){return `<div class="thumb" style="background:${o.bg}">${garment(o.shade)}</div>`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2900)}
function nav(){return `<nav class="tabbar"><button class="nav ${route==='tasks'?'on':''}" data-route="tasks">${icon('tasks')}<span>Mi trabajo</span></button><button class="nav ${route==='track'?'on':''}" data-route="track">${icon('track')}<span>Seguimiento</span></button><button class="nav ${route==='settings'?'on':''}" data-route="settings">${icon('user')}<span>Mi perfil</span></button></nav>`}
function header(){return `<header class="top"><div class="brand"><span class="mark">h.</span> hilo<span style="color:#9ca6b9;font-size:11px;margin-top:5px">taller</span></div><div class="topright"><span class="live ${remote?'':'local'}"><i></i>${remote?'EN VIVO':'DEMO LOCAL'}</span><button class="profile" data-route="settings" aria-label="Perfil">${esc((profile?.name||'?')[0].toUpperCase())}</button></div></header>`}
function auth(){return `<div class="login"><div class="bigmark">h.</div><div class="eyebrow">PRODUCCIÓN TEXTIL</div><h1>Tu espacio<br>de trabajo.</h1><p>Selecciona tu área y tu nombre para ver los pedidos que te corresponden.</p><form id="loginForm"><div class="field"><label class="fieldlabel">Mi área</label><select class="input" id="area" required><option value="">Seleccionar área</option>${STAGES.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label class="fieldlabel">Mi nombre</label><select class="input" id="person" required disabled><option value="">Primero elige tu área</option></select><input class="input hidden" id="otherName" placeholder="Escribe tu nombre" maxlength="45" autocomplete="name" style="margin-top:10px"></div><button class="go">Entrar a mi área →</button></form><div class="soft">Cada operario ve únicamente los trabajos de su sector. El supervisor puede consultar el avance en <b>Seguimiento</b>.</div></div>`}
function workCard(o){const current=STAGES[o.stage];const status=o.status==='active'?'En proceso':o.status==='paused'?'Pausado':'Pendiente';const klass=o.status==='active'?'active':o.status==='paused'?'paused':'pending';const pct=Math.round(o.stage/STAGES.length*100);return `<article class="job"><div class="jobtop">${thumb(o)}<div class="jobmain"><div class="jobid">${esc(o.id)}</div><div class="name">${esc(o.name)}</div><div class="meta">${esc(o.client)} · ${o.qty} unidades</div></div><span class="state ${klass}">${status}</span></div><div class="jobstats"><span class="tag ${o.priority==='urgent'?'urgent':''}">${o.priority==='urgent'?'⚡ Prioridad alta':'Pedido regular'}</span><span class="time">${esc(current)} · ${o.stage+1}/6</span></div><div class="track"><i style="width:${pct}%"></i></div><div class="actions">${o.status==='pending'?`<button class="action primary" data-action="start" data-id="${o.id}">▶ Comenzar</button>`:o.status==='paused'?`<button class="action primary" data-action="resume" data-id="${o.id}">▶ Continuar</button>`:`<button class="action warn" data-action="pause" data-id="${o.id}">Ⅱ Pausar</button>`}${o.status==='active'?`<button class="action success" data-action="finish" data-id="${o.id}">✓ Terminar</button>`:''}<button class="action" data-action="detail" data-id="${o.id}">Ver avance</button></div></article>`}
function tasks(){const mine=orders.filter(o=>o.stage===STAGES.indexOf(profile.area)&&o.status!=='done');let visible=mine.filter(o=>filter==='all'||o.status===filter);visible.sort((a,b)=>Number(b.priority==='urgent')-Number(a.priority==='urgent')||({active:0,paused:1,pending:2}[a.status]-{active:0,paused:1,pending:2}[b.status]));return `<div class="container"><div class="hero"><div><div class="eyebrow">${esc(profile.area.toUpperCase())} · ${esc(profile.name)}</div><h1>Mis pedidos</h1><p>Todo listo para continuar produciendo.</p></div><span class="pillcount">${mine.length} pedidos</span></div><div class="overview"><div class="metric"><strong>${mine.filter(o=>o.status==='active').length}</strong><div>En proceso</div></div><div class="metric"><strong>${mine.filter(o=>o.status==='pending').length}</strong><div>Por empezar</div></div><div class="metric"><strong>${mine.filter(o=>o.status==='paused').length}</strong><div>En pausa</div></div></div><div class="subhead"><h2>Mi bandeja</h2><small>${visible.length} resultados</small></div><div class="filters">${[['all','Todos'],['pending','Nuevos'],['active','En curso'],['paused','Pausados']].map(([v,t])=>`<button class="chip ${filter===v?'selected':''}" data-filter="${v}">${t}</button>`).join('')}</div><div class="cards">${visible.length?visible.map(workCard).join(''):`<div class="empty">No hay pedidos en esta categoría.<br>Los nuevos trabajos aparecerán aquí.</div>`}</div></div>`}
function progress(o){return o.stage>=STAGES.length?'Entregado a despacho':STAGES[o.stage]}
function track(){return `<div class="container"><div class="hero"><div><div class="eyebrow">SEGUIMIENTO GENERAL</div><h1>En producción</h1><p>Consulta el recorrido de cada pedido.</p></div><span class="pillcount">${orders.length} pedidos</span></div><div class="subhead"><h2>Todos los pedidos</h2><small>Actualización ${remote?'en vivo':'local'}</small></div>${orders.map(o=>`<button class="prod" data-action="detail" data-id="${o.id}">${thumb(o)}<div style="min-width:0"><b>${esc(o.name)}</b><span>${esc(o.id)} · ${o.qty} polos</span><div style="margin-top:7px"><span class="state ${o.status==='done'?'done':o.status==='paused'?'paused':o.status==='active'?'active':'pending'}">${esc(progress(o))}</span></div></div><div class="chevron">›</div></button>`).join('')}</div>`}
function fmt(ts){if(!ts)return '';try{return new Date(ts).toLocaleString('es-PE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function detail(){const o=orders.find(x=>x.id===focused);if(!o){route='track';return track()}const steps=STAGES.map((s,i)=>{const completed=i<o.stage,active=i===o.stage&&o.status!=='done',event=[...(o.history||[])].reverse().find(h=>h.stage===i&&h.kind==='complete');let label=completed?'Completado':active?(o.status==='paused'?'En pausa':o.status==='active'?'En curso':'Siguiente etapa'):'Pendiente';return `<div class="step"><div class="rail"><div class="dot ${completed?'complete':active?'current':''}">${completed?'✓':i+1}</div>${i!==5?`<div class="stem ${completed?'complete':''}"></div>`:''}</div><div class="stepcontent"><div><b>${esc(s)}</b><p>${event?`${esc(event.worker)} · ${fmt(event.at)}`:active&&o.worker?`Asignado a ${esc(o.worker)}`:' '}</p></div><span class="mini ${completed?'complete':active?'current':''}">${label}</span></div></div>`}).join('');return `<div class="container"><button class="back" data-route="track">← Volver a pedidos</button><div class="detailhead">${thumb(o)}<div><div class="eyebrow">${esc(o.id)}</div><h1>${esc(o.name)}</h1><p>${esc(o.client)} · ${o.qty} unidades</p></div></div><div class="subhead" style="margin-top:30px"><h2>Ruta de producción</h2><span class="state ${o.status==='done'?'done':'active'}">${o.status==='done'?'Finalizado':`${Math.min(o.stage+1,6)} de 6`}</span></div><div class="timeline">${steps}</div><p class="smallhelp">Cada cambio se registra con el responsable y la hora. ${remote?'La información se comparte con los demás dispositivos conectados.':'Estás usando datos de demostración en este navegador.'}</p></div>`}
function settings(){return `<div class="container"><div class="hero"><div><div class="eyebrow">CUENTA DE OPERARIO</div><h1>Mi perfil</h1><p>Configuración del área de trabajo.</p></div></div><div class="config"><div class="row"><div><h3>${esc(profile.name)}</h3><p style="margin:0">${esc(profile.area)}</p></div><button class="tinybtn" id="changeRole">Cambiar</button></div></div><div class="config"><h3>Conexión de datos</h3><p><b>${remote?'Firebase activo':'Demostración local'}</b>. ${remote?'Los cambios se sincronizan entre dispositivos conectados a la misma base de datos.':'Los cambios se guardan solo en este navegador. Para trabajar con varios celulares, configura Firebase en el código.'}</p></div><div class="config"><h3>Pruebas y datos</h3><p>Repón los cuatro productos de ejemplo para probar el recorrido completo.</p><button class="tinybtn" id="resetDemo">Reiniciar 4 productos de ejemplo</button></div><div class="config"><h3>Estados disponibles</h3><p>Comenzar · Pausar · Continuar · Terminar. Al terminar una etapa el pedido aparece automáticamente en el siguiente sector.</p></div></div>`}
function render(){const root=$('#app');root.innerHTML=(profile?header()+(route==='tasks'?tasks():route==='track'?track():route==='detail'?detail():settings())+nav():auth());if(!profile){bindAuth()}else{bindActions()}}
function bindAuth(){const area=$('#area'),person=$('#person'),other=$('#otherName');area.addEventListener('change',()=>{const names=ROSTER[area.value]||[];person.disabled=!area.value;person.innerHTML=`<option value="">Selecciona tu nombre</option>${names.map(n=>`<option value="${n}">${n}</option>`).join('')}<option value="otro">Otro — escribir nombre</option>`;other.classList.add('hidden')});person.addEventListener('change',()=>{other.classList.toggle('hidden',person.value!=='otro');other.required=person.value==='otro'});$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const name=person.value==='otro'?other.value.trim():person.value;if(!area.value||!name){toast('Selecciona área y nombre');return}profile={area:area.value,name};localStorage.setItem(PERSON,JSON.stringify(profile));route='tasks';render()})}
function bindActions(){document.querySelectorAll('[data-route]').forEach(x=>x.onclick=()=>{route=x.dataset.route;filter='all';render()});document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render()});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>{if(x.dataset.action==='detail'){focused=x.dataset.id;route='detail';render();return}act(x.dataset.id,x.dataset.action)});$('#changeRole')?.addEventListener('click',()=>{profile=null;localStorage.removeItem(PERSON);route='tasks';render()});$('#resetDemo')?.addEventListener('click',()=>confirmAction('Reiniciar pedidos','Se reemplazarán los pedidos de demostración de este entorno. No uses esta opción con pedidos reales.',async()=>{if(remote){toast('Reinicio bloqueado en modo compartido');return}orders=clone(SAMPLES);persist();render();toast('Se cargaron los cuatro pedidos')}))}
function confirmAction(title,msg,yes){$('#modalRoot').innerHTML=`<div class="modal" id="dlg"><div class="sheet"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button class="action" id="no">Cancelar</button><button class="action primary" id="yes">Confirmar</button></div></div></div>`;$('#no').onclick=()=>$('#modalRoot').innerHTML='';$('#dlg').onclick=e=>{if(e.target.id==='dlg')$('#modalRoot').innerHTML=''};$('#yes').onclick=async()=>{const btn=$('#yes');btn.disabled=true;try{await yes();$('#modalRoot').innerHTML=''}catch(e){btn.disabled=false;toast(e.message||'Error al guardar')}}}
async function act(id,kind){const o=orders.find(x=>x.id===id);if(!o||o.stage!==STAGES.indexOf(profile.area)){toast('Este pedido ya no está en tu área');return}if(kind==='finish'){if(o.status!=='active'){toast('Primero comienza el trabajo');return}confirmAction('¿Etapa terminada?',`Confirma que ${profile.area} ha terminado el pedido ${id}. Pasará a ${STAGES[o.stage+1]||'pedido finalizado'}.`,()=>update(id,kind));return}await update(id,kind)}
function change(o,kind){const now=new Date().toISOString();if(kind==='start'&&o.status!=='pending')throw Error('El pedido ya fue iniciado');if(kind==='resume'&&o.status!=='paused')throw Error('El pedido ya no está pausado');if(kind==='pause'&&o.status!=='active')throw Error('Este pedido no está activo');if(kind==='finish'&&o.status!=='active')throw Error('Debes comenzar antes de terminar');const previous=o.stage;o.history=o.history||[];o.history.push({stage:previous,kind:kind==='resume'?'resume':kind==='finish'?'complete':kind,worker:profile.name,at:now});o.worker=profile.name;o.updatedAt=now;if(kind==='finish'){o.stage++;o.status=o.stage>=STAGES.length?'done':'pending';o.worker=null}else{o.status=kind==='pause'?'paused':'active'}return o}
async function update(id,kind){try{if(remote){await cloudUpdate(id,kind)}else{const n=orders.find(x=>x.id===id);change(n,kind);persist();render()}toast(kind==='finish'?'✓ Pedido transferido a la siguiente etapa':kind==='pause'?'Pedido pausado':kind==='resume'?'Trabajo reanudado':'Trabajo iniciado')}catch(e){toast(e.message||'No se pudo realizar la acción')}}
// Firebase Firestore: snapshot listener and transactions. Use Authentication + security rules before real deployment.
let fire={};async function initFirebase(){if(!FIREBASE_CONFIG?.apiKey||!FIREBASE_CONFIG?.projectId)return;try{const [{initializeApp},{getFirestore,collection,onSnapshot,doc,runTransaction,getDocs,writeBatch},{getAuth,signInAnonymously}]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js')]);const app=initializeApp(FIREBASE_CONFIG);const auth=getAuth(app);await signInAnonymously(auth);db=getFirestore(app);fire={collection,onSnapshot,doc,runTransaction,getDocs,writeBatch};remote=true;unsubscribe=onSnapshot(collection(db,'orders'),snap=>{orders=snap.docs.map(d=>d.data());orders.sort((a,b)=>a.id.localeCompare(b.id));render()},err=>{remote=false;networkError=true;toast('Sin acceso a Firestore: '+err.message);render()});render()}catch(e){remote=false;toast('Firebase no disponible: '+e.message);render()}}
async function cloudUpdate(id,kind){const ref=fire.doc(db,'orders',id);await fire.runTransaction(db,async tr=>{const snap=await tr.get(ref);if(!snap.exists())throw Error('El pedido ya no existe');const o=snap.data();if(o.stage!==STAGES.indexOf(profile.area))throw Error('Pedido movido a otra etapa');if(!o.history)o.history=[];change(o,kind);tr.set(ref,o)})}
// For first-time shared demo: run seedSharedDemo() from console after configuring Firebase.
window.seedSharedDemo=async()=>{if(!remote)throw Error('Configura Firebase primero');const ref=fire.collection(db,'orders'),snap=await fire.getDocs(ref);if(!snap.empty)throw Error('La colección ya contiene pedidos; no se sobrescribirá');const batch=fire.writeBatch(db);for(const o of SAMPLES)batch.set(fire.doc(db,'orders',o.id),clone(o));await batch.commit()};
load();render();initFirebase();
</script></body></html>
